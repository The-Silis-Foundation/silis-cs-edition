<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silis Native CAD Layout Viewer</title>
    <link rel="stylesheet" href="novnc_viewer.css">
</head>
<body>
    <div id="app-container">
        <!-- Top Toolbar -->
        <header id="toolbar">
            <div class="toolbar-left">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>SILIS CAD ENGINE</span>
                </div>
                <span id="project-tag" class="project-tag">demo_soc</span>
                <div class="separator"></div>
                <div class="btn-group">
                    <button class="btn launcher-btn" data-mode="fast_peeker" title="FastSiliconPeeker (PyQt6 + OpenGL Instance-Wise Viewer)">
                        <span>Instance Peeker</span>
                    </button>
                    <button class="btn launcher-btn" data-mode="layer_viewer" title="LayerViewerPanel (C++ OpenROAD Native Layer Inspector)">
                        <span>Layer Viewer</span>
                    </button>
                    <button class="btn launcher-btn" data-mode="openroad_gui" title="Native OpenROAD GUI">
                        <span>OpenROAD GUI</span>
                    </button>
                    <button class="btn launcher-btn" data-mode="backend_gui" title="Full Silis Physical Design Suite">
                        <span>Flow GUI</span>
                    </button>
                </div>
            </div>

            <div class="toolbar-right">
                <div id="status-pill" class="status-pill status-connecting">
                    <div class="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
                <div class="separator"></div>
                <div class="btn-group">
                    <button id="btn-fit" class="btn btn-primary btn-icon-only" title="Fit to Window">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <polyline points="9 21 3 21 3 15"></polyline>
                            <line x1="21" y1="3" x2="14" y2="10"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                    <button id="btn-fullscreen" class="btn btn-icon-only" title="Fullscreen">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                        </svg>
                    </button>
                    <button id="btn-reconnect" class="btn btn-icon-only" title="Reconnect Session">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Display Canvas Viewport -->
        <main id="screen-wrapper">
            <div id="screen"></div>

            <!-- Overlay Panel for Session Status & Quick Launch -->
            <div id="overlay-panel">
                <div class="spinner"></div>
                <h3 id="overlay-title" class="overlay-title">Connecting to Native CAD Display</h3>
                <p id="overlay-desc" class="overlay-desc">
                    Establishing portless IPC tunnel to local X11 headless bridge (127.0.0.1:5901)...
                </p>
                <div class="launcher-buttons">
                    <button class="launcher-btn" data-mode="fast_peeker">
                        <div>
                            <div class="launcher-btn-title">FastSiliconPeeker</div>
                            <div class="launcher-btn-desc">PyQt6 + C++ OpenGL instance-level layout explorer</div>
                        </div>
                        <span>&rarr;</span>
                    </button>
                    <button class="launcher-btn" data-mode="layer_viewer">
                        <div>
                            <div class="launcher-btn-title">LayerViewerPanel</div>
                            <div class="launcher-btn-desc">OpenROAD C++ physical layer & pin obstruction inspector</div>
                        </div>
                        <span>&rarr;</span>
                    </button>
                    <button class="launcher-btn" data-mode="openroad_gui">
                        <div>
                            <div class="launcher-btn-title">OpenROAD Native GUI</div>
                            <div class="launcher-btn-desc">Standard OpenROAD physical design GUI viewer</div>
                        </div>
                        <span>&rarr;</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="novnc_viewer.js"></script>
</body>
</html>
