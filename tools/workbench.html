<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Silis CAD Workbench</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-dark: #181825;
      --bg-panel: #1e1e2e;
      --bg-card: #252538;
      --bg-input: #11111b;
      --border: #313244;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
      --text: #cdd6f4;
      --text-muted: #a6adc8;
      --success: #a6e3a1;
      --warning: #f9e2af;
      --danger: #f38ba8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
    }
    #workbench-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      background: var(--bg-input);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      flex-shrink: 0;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .brand-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
    }
    .tabs-section {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
    }
    .nav-tab {
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .nav-tab:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }
    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--bg-panel);
    }
    .actions-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .project-select {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      outline: none;
    }
    .action-btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .action-btn:hover {
      background: var(--accent);
      color: #11111b;
      border-color: var(--accent);
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: #000000;
    }
    .tool-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    .tool-frame.active {
      display: block;
    }
    #status-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 24px;
      background: var(--bg-input);
      border-top: 1px solid var(--border);
      padding: 0 12px;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--text-muted);
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
  </style>
</head>
<body>
  <div id="workbench-container">
    <header id="top-nav">
      <div class="brand-section">
        <span class="brand-title">Silis EDA Workbench</span>
        <span class="brand-badge">Codespaces Edition</span>
      </div>

      <nav class="tabs-section">
        <button class="nav-tab active" onclick="switchTool('schematic')">Schematic</button>
        <button class="nav-tab" onclick="switchTool('waveforms')">Waveforms</button>
        <button class="nav-tab" onclick="switchTool('peeker')">2D Layout Peeker</button>
        <button class="nav-tab" onclick="switchTool('fps')">Floorplan Studio</button>
      </nav>

      <div class="actions-section">
        <label for="cmb-active-project" style="font-size: 11px; color: var(--text-muted);">Project:</label>
        <select id="cmb-active-project" class="project-select" onchange="onProjectChange(this.value)">
          <option value="demo_soc">demo_soc</option>
          <option value="FA">FA</option>
        </select>

        <!-- Iteration 46: Gate-Level vs RTL Netlist Mode Toggle -->
        <select id="cmb-netlist-mode" class="project-select" onchange="onNetlistModeChange(this.value)" title="Netlist Representation Mode">
          <option value="rtl">RTL (Elaborated)</option>
          <option value="gls">Gate-Level (Synthesized)</option>
        </select>

        <button class="action-btn" onclick="triggerFlow('synth')">Run Synthesis</button>
        <button class="action-btn" onclick="triggerFlow('pnr')">Run PnR</button>
      </div>
    </header>

    <main id="viewport-container">
      <iframe id="frame-schematic" class="tool-frame active" src="/schematic.html?project=demo_soc"></iframe>
      <iframe id="frame-waveforms" class="tool-frame" src="/waveforms.html?project=demo_soc"></iframe>
      <iframe id="frame-peeker" class="tool-frame" src="/peeker/index.html?project=demo_soc"></iframe>
      <iframe id="frame-fps" class="tool-frame" src="/floorplanner/index.html?project=demo_soc"></iframe>
    </main>

    <footer id="status-footer">
      <div class="status-item">
        <div class="status-dot"></div>
        <span id="footer-server-status">EDA Engine Server Online: 127.0.0.1:8765</span>
      </div>

      <!-- Iteration 47: Interactive VCD Timeline Scrub Synchronization -->
      <div class="status-item">
        <span>Timeline Scrub:</span>
        <input type="range" id="timeline-scrub" min="0" max="100000" value="0" step="50" oninput="onScrubInput(this.value)" style="width: 130px; height: 12px; cursor: pointer;">
        <span id="scrub-time-label">0 ps</span>
      </div>

      <div class="status-item">
        <span id="footer-active-tool">Active Tool: Schematic Viewer</span>
      </div>
      <div class="status-item">
        <span id="footer-pdk">PDK: SkyWater 130nm</span>
      </div>
    </footer>
  </div>

  <script>
    let currentTool = 'schematic';
    let currentProject = 'demo_soc';

    function switchTool(toolId) {
      currentTool = toolId;
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tool-frame').forEach(f => f.classList.remove('active'));

      const tabMap = {
        'schematic': 0,
        'waveforms': 1,
        'peeker': 2,
        'fps': 3
      };
      const tabs = document.querySelectorAll('.nav-tab');
      if (tabs[tabMap[toolId]]) tabs[tabMap[toolId]].classList.add('active');

      const frame = document.getElementById(`frame-${toolId}`);
      if (frame) frame.classList.add('active');

      const toolNames = {
        'schematic': 'DigitalJS Schematic Viewer',
        'waveforms': 'ROHD Waveform Viewer',
        'peeker': 'FastSiliconPeeker 2D Layout',
        'fps': 'Floorplan & Power Studio'
      };
      document.getElementById('footer-active-tool').innerText = `Active Tool: ${toolNames[toolId] || toolId}`;
    }

    let currentNetlistMode = 'rtl';
    function onNetlistModeChange(mode) {
      currentNetlistMode = mode;
      const schemFrame = document.getElementById('frame-schematic');
      if (schemFrame) {
        schemFrame.src = `/schematic.html?project=${encodeURIComponent(currentProject)}&mode=${encodeURIComponent(mode)}`;
      }
    }

    function onScrubInput(val) {
      const timePs = Number(val);
      const label = document.getElementById('scrub-time-label');
      if (label) label.innerText = `${timePs} ps`;

      window.postMessage({ type: 'cursorMoved', time: timePs }, '*');
    }

    function onProjectChange(proj) {
      currentProject = proj;
      document.getElementById('frame-schematic').src = `/schematic.html?project=${encodeURIComponent(proj)}`;
      document.getElementById('frame-waveforms').src = `/waveforms.html?project=${encodeURIComponent(proj)}`;
      document.getElementById('frame-peeker').src = `/peeker/index.html?project=${encodeURIComponent(proj)}`;
      document.getElementById('frame-fps').src = `/floorplanner/index.html?project=${encodeURIComponent(proj)}`;
    }

    async function triggerFlow(step) {
      const statusEl = document.getElementById('footer-server-status');
      statusEl.innerText = `Executing flow: ${step} for ${currentProject}...`;
      try {
        const resp = await fetch(`/api/flow/run?step=${encodeURIComponent(step)}&project=${encodeURIComponent(currentProject)}`, { method: 'POST' });
        if (resp.ok) {
          statusEl.innerText = `Flow ${step} completed successfully.`;
        } else {
          statusEl.innerText = `Flow ${step} finished with status ${resp.status}.`;
        }
      } catch (err) {
        statusEl.innerText = `Flow request dispatched.`;
      }
    }

    // Cross-probing bridge between workbench tool iframes
    let _wbScrubTimer = null;
    window.addEventListener('message', async (e) => {
      const msg = e.data;
      if (!msg) return;

      const schemFrame = document.getElementById('frame-schematic');
      const waveFrame = document.getElementById('frame-waveforms');
      const peekerFrame = document.getElementById('frame-peeker');
      const fpsFrame = document.getElementById('frame-fps');

      // 1. Waveform timeline scrub -> annotate Schematic wire values
      if (msg.type === 'cursorMoved' || (msg.fromSilisRohd && msg.data && msg.data.type === 'cursorMoved')) {
        const timePs = msg.time || (msg.data && msg.data.time) || 0;
        const sigs = msg.signals || (msg.data && msg.data.signals) || [];
        const sigStr = Array.isArray(sigs) ? sigs.join(',') : '';

        if (_wbScrubTimer) clearTimeout(_wbScrubTimer);
        _wbScrubTimer = setTimeout(async () => {
          _wbScrubTimer = null;
          try {
            const query = `project=${encodeURIComponent(currentProject)}&time=${timePs}${sigStr ? '&signals=' + encodeURIComponent(sigStr) : ''}`;
            const resp = await fetch(`/api/waveform/values?${query}`);
            if (resp.ok) {
              const vals = await resp.json();
              if (Array.isArray(vals) && schemFrame && schemFrame.contentWindow) {
                schemFrame.contentWindow.postMessage({ type: 'setValues', updates: vals }, '*');
              }
            }
          } catch (err) {}
        }, 25);
      }

      // 2. Wire/Net selected in Schematic -> Add to Waveforms
      if (msg.type === 'wireSelected' || msg.type === 'netSelected') {
        const netName = msg.net || msg.name;
        if (netName && waveFrame && waveFrame.contentWindow) {
          waveFrame.contentWindow.postMessage({ type: 'addSignal', signal: netName }, '*');
        }
      }

      // 3. Macro / Component selected in FPS / Peeker
      if (msg.type === 'macroSelected' || msg.type === 'componentSelected') {
        const instName = msg.instance || msg.name || (msg.data && (msg.data.instance || msg.data.name));
        if (instName && peekerFrame && peekerFrame.contentWindow) {
          peekerFrame.contentWindow.postMessage({ type: 'highlightComponent', name: instName }, '*');
        }
      }
    });

    // Initialize projects list from API if available
    (async function initProjects() {
      try {
        const res = await fetch('/api/projects');
        if (res.ok) {
          const list = await res.json();
          if (Array.isArray(list) && list.length > 0) {
            const sel = document.getElementById('cmb-active-project');
            sel.innerHTML = '';
            for (const p of list) {
              const opt = document.createElement('option');
              opt.value = p;
              opt.innerText = p;
              sel.appendChild(opt);
            }
            if (list.includes(currentProject)) {
              sel.value = currentProject;
            } else {
              sel.value = list[0];
              onProjectChange(list[0]);
            }
          }
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
