<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Silis CAD Workbench</title>
  <style>
    :root {
      --bg: #181825;
      --card-bg: #1e1e2e;
      --border: #313244;
      --text: #cdd6f4;
      --accent: #89b4fa;
      --hover: #45475a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    #container { display: flex; flex-direction: column; width: 100%; height: 100%; }
    
    /* Top Bar */
    #header {
      height: 38px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
    }
    .badge {
      background: #313244;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      color: var(--accent);
    }
    .nav-tabs {
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .tab-btn.active {
      background: var(--border);
      border-color: var(--accent);
      color: #fff;
    }
    .tab-btn:hover { background: var(--hover); }

    /* Frame Area */
    #viewport { flex: 1; position: relative; width: 100%; height: calc(100% - 38px); }
    iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; display: none; }
    iframe.active { display: block; }
  </style>
</head>
<body>
<div id="container">
  <div id="header">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge">SILIS CAD DOCK</span>
      <span id="proj-title" style="color: #a6adc8;">Loading...</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showTab('schematic')">Schematic (DigitalJS)</button>
      <button class="tab-btn" onclick="showTab('waveforms')">Waveforms (ROHD)</button>
      <button class="tab-btn" onclick="showTab('layout')">2D Layout (Peeker)</button>
      <button class="tab-btn" onclick="showTab('floorplan')">Floorplan Studio (FPS)</button>
    </div>
  </div>
  <div id="viewport">
    <iframe id="frame-schematic" class="active" src="/schematic/digitaljs.html"></iframe>
    <iframe id="frame-waveforms" src="/waveforms/index.html"></iframe>
    <iframe id="frame-layout" src="http://localhost:6081/vnc.html?autoconnect=true&resize=remote"></iframe>
    <iframe id="frame-floorplan" src="http://localhost:6084/vnc.html?autoconnect=true&resize=remote"></iframe>
  </div>
</div>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const mod = urlParams.get('module') || 'chip_top';
  const proj = urlParams.get('project') || '';
  const initialTab = urlParams.get('tab') || 'schematic';

  document.getElementById('proj-title').innerText = mod + (proj ? ' (' + proj.split('/').pop() + ')' : '');

  // Update iframe URLs with query parameters
  document.getElementById('frame-schematic').src = '/schematic/digitaljs.html?module=' + encodeURIComponent(mod) + (proj ? '&project=' + encodeURIComponent(proj) : '');
  document.getElementById('frame-waveforms').src = '/waveforms/index.html' + (proj ? '?project=' + encodeURIComponent(proj) : '');

  function showTab(name) {
    const tabs = ['schematic', 'waveforms', 'layout', 'floorplan'];
    tabs.forEach(t => {
      const f = document.getElementById('frame-' + t);
      if (f) f.classList.remove('active');
    });
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    const targetFrame = document.getElementById('frame-' + name);
    if (targetFrame) targetFrame.classList.add('active');

    const clickedBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.innerText.toLowerCase().includes(name));
    if (clickedBtn) clickedBtn.classList.add('active');
  }

  if (initialTab && initialTab !== 'schematic') {
    showTab(initialTab);
  }
</script>
</body>
</html>
